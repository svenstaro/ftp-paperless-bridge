[package]
name = "ftp-paperless-bridge"
description = "Present a FTP server to your network-enabled document scanner and forward anything received to paperless-ngx"
license = "Apache-2.0"
repository = "https://github.com/svenstaro/ftp-paperless-bridge"
version = "0.3.2"
edition = "2024"

[dependencies]
async-tempfile = "0.8.0"
async-trait = "0.1.92"
clap = { version = "4.5.40", features = ["wrap_help", "derive", "cargo", "env"] }
color-eyre = "0.6.5"
env_logger = "0.11.8"
libunftp = "0.23.0"
log = "0.4.27"
paperless-api = "0.18.0"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "time"] }
unftp-core = "0.1.0"

# The crates.io release of paperless-api streams uploads without a Content-Length
# header, which paperless rejects unless it sits behind a buffering reverse proxy.
# Use our fixed fork until the fix is released upstream, see
# https://github.com/tripplet/paperless-api/issues/7
[patch.crates-io]
paperless-api = { git = "https://github.com/svenstaro/paperless-api", branch = "fix-upload-document" }
